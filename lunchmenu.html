:22px;color:#607369;font-size:13px}#status{color:#126346;font-weight:bold}dialog{max-width:90vw;border:0;border-radius:15px;padding:24px}dialog::backdrop{background:#14342d70}@media(max-width:480px){.card,.hero{padding:16px}.bar{flex-wrap:wrap}header strong{font-size:21px}}

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script><script>const firebaseApp = firebase.initializeApp({

    const db = firebase.database();
    
const account="토스뱅크 1000-6704-2292 안태욱";
const names=[],key='lunch-production',app=document.querySelector('#app');
const today=new Date().toLocaleDateString('sv-SE'), month=today.slice(0,7), won=n=>n.toLocaleString('ko-KR')+'원';
let period=month;
const DEFAULT_MEMBERS = ["신봉일", "이시정", "전영옥", "안태욱"];
const roster=[];
let records=[],who=Number(localStorage.getItem(key+'-member'))||0,view='team',form='',edit=-1;
let state,source,revision,editingRevision,unlocked=false,pending=false;
function importBook(raw){
 const members=[...(raw.members||DEFAULT_MEMBERS)], entries=[], adjustments={},checks={};
 const months=Object.entries(raw.months||{}).filter(([k])=>/^([1-9]|1[0-2])월$/.test(k)).sort((a,b)=>parseInt(a[0])-parseInt(b[0]));
 for(const [,m] of months){for(const map of [m.prevBalance,m.charges,...Object.values(m.entries||{}).filter(Boolean).flatMap(e=>[e.amounts,e.coffeeAmounts])])for(const n of Object.keys(map||{}))if(!members.includes(n))members.push(n)}
 const running=members.map(()=>0);
 for(const [k,m] of months){
 const ym='2026-'+String(parseInt(k)).padStart(2,'0');
 adjustments[ym]=members.map((n,i)=>Number(m.prevBalance?.[n]||0)-running[i]);
 members.forEach((n,i)=>{running[i]+=adjustments[ym][i]});
 const dayOf=v=>{const match=String(v||'').match(/(\d{1,2})\s*[/.-]\s*(\d{1,2})\s*$/);return ym+'-'+(match&&+match[1]===parseInt(k)&&+match[2]>0&&+match[2]<=31?match[2].padStart(2,'0'):'01')};
 for(const [n,c] of Object.entries(m.charges||{})){const i=members.indexOf(n);for(const v of Object.values(c?.records||{old:typeof c==='number'?{amount:c}:c})){if(!v)continue;const amount=Number(v.amount)||0;entries.push({kind:'입금',date:dayOf(v.date),person:i,value:amount,originalDate:v.date||''});running[i]+=amount}}
 for(const e of Object.values(m.entries||{}).filter(Boolean)){const meal=members.map(n=>Number(e.amounts?.[n])||0),coffee=members.map(n=>Number(e.coffeeAmounts?.[n])||0);entries.push({kind:'식사',date:dayOf(e.date),menu:e.menu||'식사',mode:e.isDelivery?'배달':'매장',meal,coffee,isTransfer:!!e.isTransfer});members.forEach((n,i)=>running[i]-=meal[i]+coffee[i])}
 }
 for(const [k,c] of Object.entries(raw.monthlyBalance||{})){if(c)checks['2026-'+String(parseInt(k)).padStart(2,'0')]={bank:c.account||0,pay:c.epay||0}}
 return {people:members.map(name=>({name,active:(raw.members||DEFAULT_MEMBERS).includes(name)})),entries,adjustments,checks}
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const options=()=>names.map((n,i)=>'<option value="'+i+'" '+(i===who?'selected':'')+'>'+esc(n)+'</option>').join('');
const impact=(r,i)=>r.kind==='입금'?(r.person===i?r.value:0):-((r.meal[i]||0)+(r.coffee[i]||0));
const amountFor=(i,test)=>records.filter(test).reduce((a,r)=>a+impact(r,i),0);
const adjustments=i=>Object.entries(state.adjustments||{}).reduce((v,[k,a])=>v+(k<=period?(a[i]||0):0),0);
const balance=i=>adjustments(i)+amountFor(i,r=>r.date.slice(0,7)<=period);
const opening=i=>adjustments(i)+amountFor(i,r=>r.date.slice(0,7)<period);
const monthly=(i,kind)=>amountFor(i,r=>r.date.startsWith(period)&&r.kind===kind);
const sum=fn=>names.reduce((a,n,i)=>a+fn(i),0);
function notice(s){document.querySelector('#status').textContent=s}
const ref=db.ref('lunchData');
function legacyKey(raw){return JSON.stringify([raw?.members,raw?.months,raw?.monthlyBalance])}
function load(raw){source=legacyKey(raw);state=raw?.operatingLedger||importBook(raw||{});revision=state.revision||0;records=state.entries||[];roster.splice(0,roster.length,...state.people);names.splice(0,names.length,...roster.map(p=>p.name));if(!names[who])who=0}
async function commit(patch){
 if(!unlocked||pending)return false;
 if(editingRevision!==revision){notice('다른 변경이 반영되었습니다. 화면을 다시 열어 주세요.');return false}
 pending=true;const expect=revision,legacy=source,next={...state,...patch,revision:expect+1};
 try{const result=await ref.transaction(raw=>{if(((raw?.operatingLedger?.revision||0)!==expect)||(!expect&&legacyKey(raw)!==legacy))return;return {...raw,operatingLedger:next}},undefined,false);
 if(!result.committed)throw Error('conflict');load(result.snapshot.val());render();notice('공유 장부에 저장했습니다.');return true
 }catch(err){notice(err.message==='conflict'?'장부가 변경되었습니다. 화면을 다시 열어 확인하세요.':'저장하지 못했습니다. 연결과 쓰기 권한을 확인하세요.');return false}finally{pending=false}
}
async function save(next){const target=day.value.slice(0,7);if(await commit({entries:next})){period=target;render()}}
function switchView(v){view=v;notice('');render()}
function login(){app.innerHTML='<form class="card" id="loginForm"><h2>관리자 로그인</h2><label class="field">기존 관리자 비밀번호<input name="pass" required type="password" autocomplete="current-password"></label><button class="primary">로그인</button></form>';
 loginForm.onsubmit=e=>{e.preventDefault();if(loginForm.elements.pass.value!==undefined){notice('비밀번호를 확인해 주세요.');return}unlocked=true;notice('');render()}}
team.onclick=()=>location.href='lunchmenu.html';admin.onclick=()=>location.href='lunchmenu_admin.html';
function memberTabs(){
 const buttons=names.map((name,i)=>
  '<button type="button" role="tab" id="member-'+i+'" data-member="'+i+'" aria-selected="'+(i===who)+'" tabindex="'+(i===who?'0':'-1')+'" aria-controls="memberPanel">'+esc(name)+'</button>'
 );
 return '<div class="member-tabs" role="tablist" aria-label="조회할 팀원">'+buttons.join('')+'</div>'
}
function bindMemberTabs(){
 const tabs=app.querySelector('[role=tablist]');
 function select(index){
  who=index;
  try{localStorage.setItem(key+'-member',who)}catch{}
  notice('');
  render();
  document.getElementById('member-'+who)?.focus({preventScroll:true})
 }
 tabs.onclick=e=>{
  const button=e.target.closest('[role=tab]');
  if(button)select(Number(button.dataset.member))
 };
 tabs.onkeydown=e=>{
  const index={ArrowLeft:(who+names.length-1)%names.length,ArrowRight:(who+1)%names.length,Home:0,End:names.length-1}[e.key];
  if(typeof index==='number'){e.preventDefault();select(index)}
 }
}
function render(){
 team.className=view==='team'?'active':'';admin.className=view==='admin'?'active':'';
 if(view==='admin'&&!unlocked){login();return}
 const personal=view==='team', recent=records.slice().reverse().filter(r=>r.kind==='입금'&&r.person===who&&r.date.slice(0,7)<=period).sort((a,b)=>b.date.localeCompare(a.date)).at(0);
 app.innerHTML='<div class="bar"><h1>'+(personal?'내 점심 장부':'팀 정산 관리')+'</h1></div>'+(personal?memberTabs():'')+'<label class="monthpick">조회 월 <input type="month" id="periodInput" value="'+period+'"></label>'+
 (personal?'<div role="tabpanel" id="memberPanel" aria-labelledby="member-'+who+'" tabindex="0">':'')+'<section class="hero"><p>'+(personal?esc(names[who]||'팀원')+'님의 점심 잔액':'팀원 선입금 잔액 합계')+'</p><b>'+won(personal?balance(who):names.reduce((a,n,i)=>a+balance(i),0))+'</b> '+(personal&&balance(who)<20000?'<span class="badge">충전 권장</span>':'')+'</section><div class="stats">'+[['전월 이월',opening],['이달 입금',i=>monthly(i,'입금')],['이달 사용',i=>-monthly(i,'식사')]].map(([label,fn])=>'<div><small>'+label+'</small><strong>'+won(personal?fn(who):sum(fn))+'</strong></div>').join('')+'</div>'+
 (personal?'<section class="card"><div class="bar"><div><h2>관리자 입금 계좌</h2><p>'+esc(account)+'</p></div><button id="copy">계좌 복사</button></div><p class="muted">최근 반영된 입금 · '+(recent?recent.date+'　'+won(recent.value):'기록 없음')+'</p></section>':'<div class="actions"><button class="primary" id="mealBtn">오늘 식사 기록</button><button id="depositBtn">입금 기록</button><button id="rosterBtn">팀원 관리</button><button id="checkBtn">월말 검산</button><button id="lockBtn">잠금</button></div><div id="editor"></div>')+
 '<section class="card"><h2>'+(personal?'내 거래 내역':'팀 거래 내역')+'</h2>'+records.map((r,i)=>({r,i})).reverse().sort((a,b)=>b.r.date.localeCompare(a.r.date)).filter(({r})=>r.date.startsWith(period)&&(!personal||impact(r,who))).map(({r,i})=>{
 const dep=r.kind==='입금',value=personal?impact(r,who):dep?r.value:-names.reduce((a,n,j)=>a+(r.meal[j]||0)+(r.coffee[j]||0),0);
 return '<details><summary>'+r.date.slice(5)+'　'+(dep?(personal?'입금':esc(names[r.person])+' 입금'):esc(r.menu)+' · '+r.mode)+'　<strong class="money">'+(value>0?'+':'')+won(value)+'</strong></summary>'+(dep?'<p>'+esc(names[r.person])+' 선입금 반영</p>'+(personal?'':'<button data-deposit="'+i+'">입금 정정</button>'):names.map((n,j)=>(!personal||who===j)&&(r.meal[j]||r.coffee[j])?'<p>'+esc(n)+' · 식사 '+won(r.meal[j])+' + 커피 '+won(r.coffee[j])+'</p>':'').join('')+(personal?'':'<button data-edit="'+i+'">식사 기록 수정</button>'))+'</details>'}).join('')+'</section>'+(personal?'</div>':'');
 periodInput.onchange=e=>{if(e.target.value){period=e.target.value;notice('');render()}};
 if(!app.querySelector('details'))app.querySelector('.card:last-child').insertAdjacentHTML('beforeend','<p class="muted">이 달에는 거래가 없습니다.</p>');
 if(!personal)app.insertAdjacentHTML('beforeend','<section class="card"><h2>팀원별 월간 정산</h2><div class="scroll"><table><thead><tr><th>팀원</th><th>이월</th><th>입금</th><th>사용</th><th>잔액</th></tr></thead><tbody>'+names.map((n,i)=>'<tr><th>'+esc(n)+'</th>'+[opening(i),monthly(i,'입금'),-monthly(i,'식사'),balance(i)].map(v=>'<td>'+won(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></section>');
 if(personal){bindMemberTabs();copy.onclick=async()=>{try{await navigator.clipboard.writeText(account.match(/[0-9][0-9-]{5,}/)?.[0]||account);notice('계좌 정보를 복사했습니다.')}catch{notice('위 계좌 정보를 선택해 복사해 주세요.')}}}
 else{rosterBtn.onclick=openRoster;checkBtn.onclick=openCheck;app.querySelectorAll("[data-deposit]").forEach(b=>b.onclick=()=>openForm("deposit",+b.dataset.deposit));lockBtn.onclick=()=>{unlocked=false;switchView('admin')};mealBtn.onclick=()=>openForm('meal');depositBtn.onclick=()=>openForm('deposit');app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm('meal',+b.dataset.edit))}
}
function openRoster(){
 editingRevision=revision;
 editor.innerHTML='<form id="peopleForm" class="card"><h2>팀원 관리</h2>'+roster.map((person,i)=>'<div class="person"><label><input type="checkbox" id="active'+i+'" '+(person.active?'checked':'')+'> 활동 중</label><input aria-label="팀원 이름" id="name'+i+'" required maxlength="24"></div>').join('')+'<label class="field">새 팀원<input name="newName" maxlength="24" placeholder="추가할 이름"></label><p class="muted">활동을 종료해도 지난 거래와 잔액은 보존됩니다.</p><button class="primary">팀원 저장</button></form>';
 roster.forEach((person,i)=>document.getElementById('name'+i).value=person.name);
 peopleForm.onsubmit=e=>{e.preventDefault();
 const next=roster.map((_,i)=>({name:document.getElementById('name'+i).value.trim(),active:document.getElementById('active'+i).checked}));
 const added=peopleForm.elements.newName.value.trim();if(added)next.push({name:added,active:true});
 if(next.some(p=>!p.name)||new Set(next.map(p=>p.name)).size!==next.length){notice('팀원 이름을 비어 있거나 중복되지 않게 입력해 주세요.');return}
 commit({people:next})}
}
function openCheck(){
 editingRevision=revision;const previous=state.checks?.[period],total=sum(balance);
 editor.innerHTML='<form class="card" id="checkForm"><h2>'+period+' 월말 검산</h2><p class="muted">관리자 계좌와 e바구페이에 보관한 팀 자금만 입력하세요.</p><div class="grid"><label class="field">계좌 내 팀 자금 (원)<input name="bank" type="number" min="0" required></label><label class="field">e바구페이 팀 자금 (원)<input name="pay" type="number" min="0" required></label></div><p class="delta" id="difference"></p><button class="primary">검산 금액 저장</button></form>';
 const f=document.querySelector('#checkForm');f.elements.bank.value=previous?.bank??'';f.elements.pay.value=previous?.pay??0;
 const update=()=>{const diff=Number(f.elements.bank.value)+Number(f.elements.pay.value)-total;
 difference.textContent='장부 잔액 '+won(total)+(f.elements.bank.value===''?'':diff===0?' · 확인 금액 일치':' · 확인 금액이 '+won(Math.abs(diff))+(diff>0?' 많습니다':' 적습니다'))};
 f.oninput=update;update();f.onsubmit=e=>{e.preventDefault();commit({checks:{...state.checks,[period]:{bank:Number(f.elements.bank.value),pay:Number(f.elements.pay.value)}}})};
 editor.scrollIntoView({block:'start'})
}
function openForm(type,index=-1){
 editingRevision=revision;edit=index;notice('');const r=records[index], deposit=type==='deposit';
 editor.innerHTML='<form class="card" id="entry"><h2>'+(deposit?(r?'입금 정정':'입금 기록'):r?'식사 기록 수정':'오늘 식사 기록')+'</h2><div class="grid"><label class="field">날짜<input id="day" type="date" required value="'+(r?.date||today)+'"></label>'+
 (deposit?'<label class="field">입금자<select id="payer">'+options()+'</select></label><label class="field">입금액 (원)<input id="amount" type="number" min="1" step="1" required></label>':'<label class="field">식사 방식<select id="mode"><option>매장</option><option '+(r?.mode==='배달'?'selected':'')+'>배달</option></select></label><label class="field">메뉴<input id="menu" required placeholder="예: 비빔밥" value="'+esc(r?.menu||'')+'"></label>')+'</div><div id="parts"></div><div class="actions"><button class="primary">저장</button><button type="button" id="cancel">닫기</button></div></form>';
 cancel.onclick=()=>{editor.innerHTML='';edit=-1};
 if(!deposit){
 const available=i=>roster[i].active||!!(r?.meal[i]||r?.coffee[i]);
 const group=(id,title,values)=>'<section><h3>'+title+'</h3><div class="actions"><label><input type="checkbox" id="'+id+'All"> 전체 선택</label><input type="number" min="0" step="1" id="'+id+'Common" placeholder="공통 금액 (원)" aria-label="'+title+' 공통 금액"><button type="button" id="'+id+'Apply">선택한 사람에게 적용</button></div>'+names.map((n,i)=>'<div class="person"><label><input type="checkbox" id="'+id+'c'+i+'" '+(!available(i)?'disabled ':'')+(values[i]?'checked':'')+'> '+esc(n)+'</label><input type="number" min="0" step="1" id="'+id+i+'" aria-label="'+esc(n)+' '+title+'" placeholder="금액 (원)" value="'+(values[i]||'')+'"></div>').join('')+'</section>';
 parts.innerHTML=group('m','식사 참여자',r?.meal||[])+'<hr><label><input type="checkbox" id="withCoffee"> 커피 추가</label><div id="coffeeBox">'+group('c','커피 마신 사람',r?.coffee||[])+'</div><div id="preview" class="card" aria-live="polite"></div>';
 const el=id=>document.getElementById(id);
 withCoffee.checked=!!r?.coffee.some(Boolean);
 function values(id){return names.map((n,i)=>el(id+'c'+i).checked&&(id==='m'||withCoffee.checked)?Number(el(id+i).value):0)}
 function refresh(){coffeeBox.hidden=!withCoffee.checked;for(const id of ['m','c']){el(id+'All').checked=names.every((_,i)=>!available(i)||el(id+'c'+i).checked);names.forEach((_,i)=>{el(id+i).disabled=!el(id+'c'+i).checked||(id==='c'&&!withCoffee.checked)})}
 const totals=values('m').map((v,i)=>v+values('c')[i]);preview.innerHTML='<h2>차감 미리보기</h2>'+names.map((n,i)=>'<div class="line"><span>'+esc(n)+'</span><span>'+won(totals[i])+'</span></div>').join('')+'<div class="row"><b>총 차감액</b><b>'+won(totals.reduce((a,b)=>a+b,0))+'</b></div>'}
 for(const id of ['m','c']){el(id+'All').onchange=e=>{names.forEach((_,i)=>el(id+'c'+i).checked=available(i)&&e.target.checked);refresh()};el(id+'Apply').onclick=()=>{const input=el(id+'Common');if(!input.reportValidity()||!input.value)return;names.forEach((_,i)=>{if(el(id+'c'+i).checked)el(id+i).value=input.value});refresh()}}
 withCoffee.onchange=()=>{if(!withCoffee.checked){const amounts=names.map((_,i)=>el('cc'+i).checked?Number(el('c'+i).value):0),sum=amounts.reduce((a,b)=>a+b,0);if(sum&&!confirm('커피 '+amounts.filter(Boolean).length+'명분 '+won(sum)+'을 정산에서 뺄까요?'))withCoffee.checked=true;else names.forEach((_,i)=>{el('cc'+i).checked=false;el('c'+i).value=''})}refresh()};entry.oninput=refresh;refresh();
 entry.onsubmit=e=>{e.preventDefault();const meal=values('m'),coffee=values('c');if(!menu.value.trim()||!meal.concat(coffee).some(Boolean)){notice('메뉴와 차감할 금액을 입력해 주세요.');return}const item={...r,kind:'식사',date:day.value,menu:menu.value.trim(),mode:mode.value,meal,coffee};const next=records.slice();next[index<0?next.length:index]=item;save(next)}
 }else{
 if(r){payer.value=r.person;amount.value=r.value;parts.innerHTML='<p class="delta">기존 기록 · '+r.date+'　'+esc(names[r.person])+'　'+won(r.value)+'</p>'}
 entry.onsubmit=e=>{e.preventDefault();const item={kind:'입금',date:day.value,person:Number(payer.value),value:Number(amount.value)};
 if(r&&!confirm(r.date+' '+esc(names[r.person])+' '+won(r.value)+' → '+item.date+' '+names[item.person]+' '+won(item.value)+'으로 정정할까요?'))return;
 const next=records.slice();next[index<0?next.length:index]=item;save(next)}
 }
 editor.scrollIntoView({block:'start'})
}
app.textContent='공유 장부를 불러오는 중입니다.';
ref.on('value',snap=>{const editing=!!document.querySelector('#editor form');load(snap.val());if(!editing&&!document.querySelector('#loginForm'))render()},()=>{app.textContent='장부를 불러올 수 없습니다. 연결과 읽기 권한을 확인하세요.'});
</script></html>
